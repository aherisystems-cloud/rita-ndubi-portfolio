<style>
  :root {
    --brand: #F16232; --brand-dark: #B53A16; --brand-soft: #FEF4EE; --brand-line: #FAC7AA;

    --dim: 0.22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); }
  .brand b { display: block; font-size: 15px; }
  .brand span { display: block; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .tabs { display: flex; gap: 6px; background: #f1f5f9; padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
  .tab { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; font: 600 13px Inter, sans-serif; color: #475569; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 28px; }
  .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
  .eyebrow { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-dark); }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(24px, 3vw, 36px); margin: 4px 0 6px; letter-spacing: -.02em; line-height: 1.1; }
  .lede { color: var(--muted); margin: 0; font-size: 15px; max-width: 760px; line-height: 1.5; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: stretch; }
  .canvas { border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(#fff, #fbfcfd); padding: 10px; position: relative; overflow: hidden; }
  svg { width: 100%; height: auto; display: block; }
  .node rect.box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.4; transition: all .45s ease; }
  .node text { transition: opacity .45s ease; }
  .node .t { font: 600 14px Inter, sans-serif; fill: var(--ink); }
  .node .s { font: 500 11px 'JetBrains Mono', monospace; fill: var(--muted); }
  .node .tag { font: 600 9.5px 'JetBrains Mono', monospace; fill: var(--brand-dark); letter-spacing: .08em; }

  .node.dim { opacity: var(--dim); }
  .node.on rect.box { stroke: var(--brand); stroke-width: 2.4; fill: var(--brand-soft); filter: drop-shadow(0 6px 14px rgba(241,98,50,.18)); }
  .node.hub rect.box { fill: #0f172a; stroke: #0f172a; }
  .node.hub .t { fill: #fff; } .node.hub .s { fill: #fdba74; }
  .node.hub.on rect.box { fill: #0f172a; stroke: var(--brand); }
  .edge { fill: none; stroke: #cbd5e1; stroke-width: 1.6; transition: all .45s ease; }
  .edge.dim { opacity: .25; }
  .edge.on { stroke: var(--brand); stroke-width: 2.6; stroke-dasharray: 7 7; animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .dot { fill: var(--brand); filter: drop-shadow(0 0 6px rgba(241,98,50,.8)); }
  .lane { font: 600 10.5px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: .12em; }
  aside { border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; background: #fff; }
  .counter { display: flex; align-items: center; justify-content: space-between; font: 600 11px 'JetBrains Mono', monospace; color: var(--muted); }
  .letter { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-dark); border: 1px solid var(--brand-line); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 14px; }
  .chip { font: 500 11px 'JetBrains Mono', monospace; padding: 4px 9px; border-radius: 8px; background: #f1f5f9; border: 1px solid var(--line); color: #334155; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; font: 600 13px Inter, sans-serif; cursor: pointer; color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: #cbd5e1; cursor: pointer; }
  .dots button.cur { background: var(--brand); transform: scale(1.3); }
  .hint { margin-top: 10px; font: 500 11px 'JetBrains Mono', monospace; color: #94a3b8; text-align: center; }
  .offer { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .offer div { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--panel); }
  .offer b { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .offer span { font-size: 13px; color: #475569; line-height: 1.5; }
  .offer-title { margin-top: 22px; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } header { flex-wrap: wrap; } .intro { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { .edge.on { animation: none; } .dot { display: none; } }
</style>
</head>

const NS = 'http://www.w3.org/2000/svg';
const W = 200, H = 86;
const $ = (id) => document.getElementById(id);
let cur = 'klock', step = 0, timer = null, rafs = [];

function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function box(n) { return { x: n.x, y: n.y, w: n.w || W, h: n.h || H }; }

// Anchor on the side facing the other node: horizontal neighbours use left/right, others top/bottom.
function pathBetween(a, b) {
  const A = box(a), B = box(b);
  const ac = { x: A.x + A.w / 2, y: A.y + A.h / 2 }, bc = { x: B.x + B.w / 2, y: B.y + B.h / 2 };
  if (Math.abs(ac.y - bc.y) < 20) {
    const right = bc.x > ac.x;
    const sx = right ? A.x + A.w : A.x, ex = right ? B.x : B.x + B.w;
    return `M${sx},${ac.y} L${ex},${bc.y}`;
  }
  const down = bc.y > ac.y;
  const sy = down ? A.y + A.h : A.y, ey = down ? B.y : B.y + B.h;
  const my = (sy + ey) / 2;
  return `M${ac.x},${sy} C${ac.x},${my} ${bc.x},${my} ${bc.x},${ey}`;
}

function render() {
  const P = PROJECTS[cur];
  const svg = $('svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 1220 ${P.height}`);
  const defs = el('defs', {}, svg);
  const m = el('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#cbd5e1' }, m);
  const mOn = el('marker', { id: 'arrowOn', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#F16232' }, mOn);

  P.lanes.forEach((l) => { const t = el('text', { x: 22, y: l.y, class: 'lane' }, svg); t.textContent = l.t; });

  const byId = Object.fromEntries(P.nodes.map((n) => [n.id, n]));
  const edgeLayer = el('g', {}, svg);
  P.edges.forEach(([f, t]) => {
    el('path', { d: pathBetween(byId[f], byId[t]), class: 'edge', 'data-k': f + '>' + t, 'marker-end': 'url(#arrow)' }, edgeLayer);
  });
  el('g', { id: 'dots' }, svg);

  P.nodes.forEach((n) => {
    const b = box(n);
    const g = el('g', { class: 'node' + (n.hub ? ' hub' : ''), 'data-id': n.id }, svg);
    el('rect', { class: 'box', x: b.x, y: b.y, width: b.w, height: b.h, rx: 16 }, g);
    const cx = b.x + 16;
    if (n.tag) el('text', { class: 'tag', x: cx, y: b.y + 22 }, g).textContent = n.tag;
    el('text', { class: 't', x: cx, y: b.y + (n.hub ? 27 : 46) }, g).textContent = n.t;
    el('text', { class: 's', x: cx, y: b.y + (n.hub ? 47 : 66) }, g).textContent = n.s;
  });

  $('eyebrow').textContent = P.eyebrow;
  $('title').textContent = P.title;
  $('lede').textContent = P.lede;
  $('offerTitle').textContent = P.offerTitle;
  $('offer').innerHTML = P.offer.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');
  $('dots').innerHTML = P.steps.map((s, i) => `<button aria-label="Step ${i + 1}: ${s.t}" data-i="${i}"></button>`).join('');
  [...$('dots').children].forEach((b) => b.onclick = () => go(+b.dataset.i));
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.k === cur));
  show();
}

function animateDots(paths) {
  rafs.forEach(cancelAnimationFrame); rafs = [];
  const layer = $('dots'); layer.innerHTML = '';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  paths.forEach((p, i) => {
    const len = p.getTotalLength();
    const c = el('circle', { r: 5, class: 'dot' }, layer);
    const start = performance.now() + i * 250;
    const tick = (now) => {
      const t = ((now - start) / 1600) % 1;
      const pt = p.getPointAtLength(Math.max(0, t) * len);
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
      rafs.push(requestAnimationFrame(tick));
    };
    rafs.push(requestAnimationFrame(tick));
  });
}

function show() {
  const P = PROJECTS[cur], S = P.steps[step];
  const all = S.n === '*';
  const onNodes = new Set(all ? P.nodes.map((n) => n.id) : S.n);
  const onEdges = new Set(S.e === 'all' ? P.edges.map(([f, t]) => f + '>' + t) : (S.e || []).map(([f, t]) => f + '>' + t));
  document.querySelectorAll('.node').forEach((g) => {
    const on = onNodes.has(g.dataset.id);
    g.classList.toggle('on', on && !all);
    g.classList.toggle('dim', !on);
  });
  const active = [];
  document.querySelectorAll('.edge').forEach((p) => {
    const on = onEdges.has(p.dataset.k);
    p.classList.toggle('on', on);
    p.classList.toggle('dim', !on && !all);
    p.setAttribute('marker-end', on ? 'url(#arrowOn)' : 'url(#arrow)');
    if (on) active.push(p);
  });
  animateDots(S.e === 'all' ? [] : active);

  $('count').textContent = `Step ${step + 1} of ${P.steps.length}`;
  $('letter').textContent = S.l;
  $('stepTitle').textContent = S.t;
  $('stepText').innerHTML = S.p.map((x) => `<p>${x}</p>`).join('');
  $('chips').innerHTML = (S.c || []).map((c) => `<span class="chip">${c}</span>`).join('');
  $('prev').disabled = step === 0;
  $('next').textContent = step === P.steps.length - 1 ? 'Restart ↺' : 'Next →';
  [...$('dots').children].forEach((b, i) => b.classList.toggle('cur', i === step));
}

function go(i) { const n = PROJECTS[cur].steps.length; step = (i + n) % n; show(); }
function switchTo(k) { cur = k; step = 0; stopPlay(); history.replaceState(null, '', '#' + k); render(); }
function stopPlay() { clearInterval(timer); timer = null; }
function togglePlay() { if (timer) return stopPlay(); timer = setInterval(() => go(step + 1), 6500); }

$('tabs').innerHTML = Object.entries(PROJECTS).map(([k, p]) => `<button class="tab" role="tab" data-k="${k}">${p.tab}</button>`).join('');
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => switchTo(t.dataset.k));
$('prev').onclick = () => { stopPlay(); go(step - 1); };
$('next').onclick = () => { stopPlay(); go(step + 1); };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stopPlay(); go(step + 1); }
  else if (e.key === 'ArrowLeft') { stopPlay(); go(step - 1); }
  else if (e.key.toLowerCase() === 'p') togglePlay();
  else if (['1', '2', '3'].includes(e.key)) switchTo(Object.keys(PROJECTS)[+e.key - 1]);
});
const fromHash = location.hash.slice(1);
cur = PROJECTS[fromHash] ? fromHash : 'klock';
render();
</script>
